server {
    # Listen on port 80 (standard HTTP).
    listen 80;
    server_name localhost;

    # Where nginx looks for files to serve. This is where the React build
    # output (dist/) was copied during the Docker image build.
    root /usr/share/nginx/html;

    # Default file to serve when a directory is requested (e.g. http://localhost/).
    index index.html;

    # -------------------------------------------------------------------------
    # Gzip Compression — shrinks responses before sending them to the browser.
    # Typically reduces JS/CSS size by ~70%, making the app load faster.
    # -------------------------------------------------------------------------
    gzip on;
    # Only compress these file types — binary files (images) don't benefit.
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    # Don't bother compressing tiny files — the overhead isn't worth it.
    gzip_min_length 256;
    # Tells proxies/CDNs to cache both the compressed and uncompressed versions.
    gzip_vary on;

    # -------------------------------------------------------------------------
    # Security Headers — instruct browsers to enforce security policies.
    # -------------------------------------------------------------------------
    # Prevents browsers from guessing the content type (MIME sniffing attack).
    add_header X-Content-Type-Options "nosniff" always;
    # Blocks the page from being embedded in an iframe (clickjacking protection).
    add_header X-Frame-Options "DENY" always;
    # Controls how much referrer info is sent when navigating to other sites.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # React Router — client-side routing support
    # -------------------------------------------------------------------------
    location / {
        # Try to serve the exact file, then as a directory, then fall back to
        # index.html. This is what makes React Router work — without it, a hard
        # refresh on /cart or /orders would return a 404 (file doesn't exist).
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # API Proxy — forward /api/* requests to the Express server
    # -------------------------------------------------------------------------
    location /api/ {
        # "server" is the Docker service name — Docker's internal DNS resolves
        # it to the server container's IP automatically.
        proxy_pass http://server:3001/;

        # Use HTTP/1.1 for the upstream connection (required for keep-alive).
        proxy_http_version 1.1;

        # Pass the original request headers to Express so it sees the real
        # client IP, hostname, and protocol (useful for logging, rate limiting).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Express whether the original request was HTTP or HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — prevent slow requests from hanging connections forever.
        proxy_connect_timeout 10s;  # time to establish connection to server
        proxy_send_timeout 30s;     # time to send the full request
        proxy_read_timeout 30s;     # time to wait for the server's response
    }

    # -------------------------------------------------------------------------
    # Static Asset Caching — cache fingerprinted files aggressively
    # -------------------------------------------------------------------------
    # Vite adds a content hash to filenames (e.g. main.a1b2c3.js).
    # Since the filename changes when content changes, it's safe to cache
    # forever — the browser will fetch the new file when the hash changes.
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # HTTPS — uncomment to enable SSL (requires certificates)
    # -------------------------------------------------------------------------
    # To enable HTTPS:
    #   1. Obtain SSL certificates (e.g. via Let's Encrypt / certbot)
    #   2. Mount them into the nginx container in docker-compose.prod.yml
    #   3. Change "listen 80" above to "listen 443 ssl"
    #   4. Uncomment the lines below
    #
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    #
    # Add a separate block to redirect HTTP → HTTPS:
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
}
