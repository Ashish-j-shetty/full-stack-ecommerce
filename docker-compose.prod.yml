# docker-compose.prod.yml — PRODUCTION
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Differences from dev:
#   - Images are pre-built and pulled from GHCR (not built locally)
#   - Server runs compiled JS (node dist/index.js), not tsx watch
#   - Client is pre-built static files served by nginx, not Vite dev server
#   - No volume mounts (code is baked into the images)
#   - No postgres-test (not needed in production)
#   - Server port is NOT exposed publicly (only nginx talks to it)

services:
  # ---------------------------------------------------------------------------
  # Database — same as dev but without a host port mapping (not exposed)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Persist data across deployments — without this every deploy wipes the DB.
      - pgdata:/var/lib/postgresql/data
    # Caps Postgres RAM usage on a 1 GB server.
    # Without this Postgres grabs as much RAM as it wants and starves Node.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Express API server — pulls pre-built image from GHCR
  # Built by GitHub Actions CD workflow on every push to main
  # ---------------------------------------------------------------------------
  server:
    # Pull the pre-built image from GitHub Container Registry.
    # CD workflow builds and pushes this on every successful CI run.
    image: ghcr.io/ashish-j-shetty/full-stack-ecommerce-server:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # "postgres" resolves to the postgres container via Docker's internal DNS.
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    # No "ports:" here — the server is NOT exposed to the host machine.
    # Only the nginx container (on the same Docker network) talks to it.
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Nginx — single public entry point for the entire application
  # Serves React static files + proxies /api/* to the server container
  # Built by GitHub Actions CD workflow on every push to main
  # ---------------------------------------------------------------------------
  nginx:
    # Pull the pre-built image from GitHub Container Registry.
    # This image contains the React build output + nginx config.
    image: ghcr.io/ashish-j-shetty/full-stack-ecommerce-client:latest
    restart: unless-stopped
    ports:
      # Only nginx is exposed to the outside world.
      # All traffic (static files + API calls) flows through these ports.
      - "80:80"
      - "443:443" # Required for HTTPS/Certbot later
    depends_on:
      # Ensure the server is up before nginx starts accepting requests.
      - server

volumes:
  # Named volume for Postgres data.
  # Data persists across container restarts and deployments.
  pgdata:
