# docker-compose.yml — LOCAL DEVELOPMENT
# Usage: docker compose up
#
# Starts: postgres + postgres-test + server (tsx watch) + client (vite dev)
# Hot reload is enabled for both server and client via volume mounts.

services:

  # ---------------------------------------------------------------------------
  # Main database — used by the running server
  # ---------------------------------------------------------------------------
  postgres:
    # Use the official Postgres image, Alpine variant (smaller size).
    image: postgres:16-alpine

    # Restart the container automatically unless you explicitly stop it.
    restart: unless-stopped

    environment:
      # These values are read from your .env file at the project root.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      # host:container — exposes Postgres on your machine so you can connect
      # with a DB client (e.g. TablePlus, psql) at localhost:5432.
      - "5432:5432"

    volumes:
      # Named volume — data persists across container restarts/rebuilds.
      # Without this, your database would be wiped every time you restart.
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      # pg_isready checks if Postgres is accepting connections.
      # Other services use "condition: service_healthy" to wait for this.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s   # run the check every 5 seconds
      timeout: 5s    # fail the check if it takes longer than 5 seconds
      retries: 5     # mark unhealthy after 5 consecutive failures

  # ---------------------------------------------------------------------------
  # Test database — isolated DB used only when running Jest tests
  # ---------------------------------------------------------------------------
  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Separate database name so tests never touch your development data.
      POSTGRES_DB: ${POSTGRES_DB}_test
    ports:
      # Mapped to 5433 on the host to avoid conflicting with the main DB on 5432.
      - "5433:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Express API server — runs in dev mode with hot reload
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server      # build context is the ./server directory
      dockerfile: Dockerfile # use server/Dockerfile
      target: dev            # build only up to the "dev" stage (skips builder/production)
    restart: unless-stopped
    ports:
      # Exposes the API at http://localhost:3001 on your machine.
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: ${PORT}
      # Uses the "postgres" service name — Docker's internal DNS resolves
      # container names within the same compose network automatically.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      # Mount local source into the container so tsx watch picks up changes.
      # Editing a .ts file on your machine triggers a server restart instantly.
      - ./server/src:/app/src
      - ./server/migrations:/app/migrations
    depends_on:
      postgres:
        # Wait until postgres passes its healthcheck before starting the server.
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # React client — runs Vite dev server with Hot Module Replacement
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev            # build only the "dev" stage (skips builder/production)
    restart: unless-stopped
    ports:
      # Access the React app at http://localhost:5173
      - "5173:5173"
    environment:
      # Tells the client where the API lives. In dev, it's directly exposed
      # at localhost:3001 (no nginx proxy in front of it).
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      # Hot reload — file changes on your machine sync into the container.
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
    depends_on:
      # Start the server before the client so API calls don't fail on boot.
      - server

  # ===========================================================================
  # [SCALING] Redis Cache Service
  # ===========================================================================
  # Uncomment the block below to enable Redis caching.
  # Also set ENABLE_REDIS=true and REDIS_URL on the server service above.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redisdata:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #
  # Then add these to the server service's environment:
  #   ENABLE_REDIS: "true"
  #   REDIS_URL: redis://redis:6379
  #
  # And add to the server service's depends_on:
  #   redis:
  #     condition: service_healthy
  # ===========================================================================

  # ===========================================================================
  # [SCALING] Nginx Reverse Proxy
  # ===========================================================================
  # Uncomment the block below to put Nginx in front of your app.
  # Nginx serves the React production build as static files and proxies
  # /api/* requests to Express. Much faster than serving via Vite/Node.
  #
  # Before enabling:
  #   1. Build the React app: cd client && npm run build
  #   2. The build output (client/dist/) is mounted into the Nginx container
  #
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     # [SCALING] Uncomment for HTTPS:
  #     # - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./client/dist:/usr/share/nginx/html:ro
  #     # [SCALING] Uncomment for HTTPS and mount your certificates:
  #     # - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - server
  #
  # When Nginx is enabled:
  #   - Access the app at http://localhost (port 80) instead of :5173
  #   - You can stop the client container — Nginx serves the static files
  #   - The server container still runs, but only Nginx talks to it
  # ===========================================================================

volumes:
  # Declares the named volume used by the postgres service above.
  # Docker manages this on your machine — data survives container restarts.
  pgdata:
  # [SCALING] Uncomment when enabling Redis:
  # redisdata:
