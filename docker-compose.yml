services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}_test
    ports:
      - "5433:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./server/src:/app/src
      - ./server/migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
    depends_on:
      - server

  # ===========================================================================
  # [SCALING] Redis Cache Service
  # ===========================================================================
  # Uncomment the block below to enable Redis caching.
  # Also set ENABLE_REDIS=true and REDIS_URL on the server service above.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redisdata:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #
  # Then add these to the server service's environment:
  #   ENABLE_REDIS: "true"
  #   REDIS_URL: redis://redis:6379
  #
  # And add to the server service's depends_on:
  #   redis:
  #     condition: service_healthy
  # ===========================================================================

  # ===========================================================================
  # [SCALING] Nginx Reverse Proxy
  # ===========================================================================
  # Uncomment the block below to put Nginx in front of your app.
  # Nginx serves the React production build as static files and proxies
  # /api/* requests to Express. Much faster than serving via Vite/Node.
  #
  # Before enabling:
  #   1. Build the React app: cd client && npm run build
  #   2. The build output (client/dist/) is mounted into the Nginx container
  #
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     # [SCALING] Uncomment for HTTPS:
  #     # - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./client/dist:/usr/share/nginx/html:ro
  #     # [SCALING] Uncomment for HTTPS and mount your certificates:
  #     # - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - server
  #
  # When Nginx is enabled:
  #   - Access the app at http://localhost (port 80) instead of :5173
  #   - You can stop the client container — Nginx serves the static files
  #   - The server container still runs, but only Nginx talks to it
  # ===========================================================================

volumes:
  pgdata:
  # [SCALING] Uncomment when enabling Redis:
  # redisdata:
