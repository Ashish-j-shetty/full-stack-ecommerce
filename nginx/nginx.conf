# =============================================================================
# [SCALING] Nginx Reverse Proxy Configuration
# =============================================================================
# This config is used when you enable the Nginx service in docker-compose.yml.
# It replaces both the Vite dev server and direct Express access with a single
# entry point on port 80 (or 443 with SSL).
#
# What Nginx does:
#   1. Serves the React production build (static files) — much faster than Node
#   2. Proxies /api/* requests to the Express backend
#   3. Compresses responses (gzip) — reduces bandwidth by ~70%
#   4. Handles connection buffering — holds slow clients so Node doesn't have to
#   5. (Optional) Terminates SSL/HTTPS
# =============================================================================

# [SCALING] Upstream — points to the Express server container.
# If using clustering with multiple server replicas, Docker handles load balancing.
upstream api_server {
    server server:3001;
}

server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------------------
    # Gzip Compression — reduces response sizes by ~70%
    # -------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # -------------------------------------------------------------------------
    # Security Headers (same as Express middleware, but applied at Nginx level)
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Serve React Static Files
    # -------------------------------------------------------------------------
    # The React production build (from `npm run build`) outputs to client/dist/.
    # Nginx serves these directly — no Node.js involved for HTML/CSS/JS.
    root /usr/share/nginx/html;
    index index.html;

    # For React Router — all non-API, non-file requests serve index.html
    # so client-side routing works (e.g., /cart, /orders, /login)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Proxy API Requests to Express
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;

        # Pass real client info to Express (for rate limiting, logging)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — don't let slow requests hang forever
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # [SCALING] SSL/HTTPS — Uncomment and provide certificates to enable
    # -------------------------------------------------------------------------
    # To enable HTTPS:
    #   1. Obtain SSL certificates (e.g., via Let's Encrypt / certbot)
    #   2. Mount them into the Nginx container (see docker-compose.yml)
    #   3. Uncomment the block below and change 'listen 80' to 'listen 443 ssl'
    #   4. Add a redirect from port 80 to 443 (shown below)
    #
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    #
    # To redirect HTTP → HTTPS, add a separate server block:
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
}
